name: CI
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # MediaPipe is faked in the unit tests, so only the lightweight deps are installed.
      - run: pip install Flask==2.3.3 Flask-CORS==4.0.0 Pillow==10.0.1 numpy==1.24.3 opencv-python-headless==4.8.1.78
      - run: python -m unittest discover -s tests
